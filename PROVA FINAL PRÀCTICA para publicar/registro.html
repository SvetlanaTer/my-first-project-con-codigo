<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rock School Barcelona</title>
	<link rel="stylesheet" type="text/css" href="estilos.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
	<style>
		main {
			background-image: url(img/footer.jpg);
			background-position: center center;
			background-size: cover;
			border-radius: 20px;
			margin: 1%;
		}

		h2 {
			color: #FFF;
			margin-top: 3%;
		}

		form {
			background-color: rgba(255, 255, 255, 0.8);
			padding: 1%;
			margin: 1% 3%;
			border-radius: 20px;
			margin-bottom: 5%;
		}

		article {
			display: flex;
		}

		article form {
			flex: 1;
		}

		article aside {
			flex: 1;
		}

		main label {
			font-family: arial;
			font-size: 1vw;
			margin: 0.3%;
		}

		main input {
			padding: 0.3%;
			margin: 1%;
		}

		main form button {
			margin-top: 2%;
			background-color: #FFF;
			color: #000;
			border: 2px solid #000;
			padding: 2% 3%;
			border-radius: 20px;
			font-size: 1vw;
			font-family: Metal Mania;
			margin-right: 1%;
		}

		main form button:hover {
			background-color: #000;
			color: #ED1C24;
		}
	</style>
</head>

<body>
	<header>
		<figure>
			<img src="img/logomini.png" alt="logo" />
		</figure>
		<h1>Rock School y Tienda de música</h1>
	</header>
	<nav>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="services.html">Services</a></li>
			<li><a href="galeria.html">Galeria</a></li>
			<li><a href="tienda.html">Tienda</a></li>
			<li><a href="registro.html">Registro</a></li>
			<li><a href="contacto.html">Contacto</a></li>
		</ul>
	</nav>
	<section>
		<form>
			<label>Usuario: </label>
			<input type="text" name="usr_name" /><br />
			<label>Contraseña: </label>
			<input type="password" name="password" />
			<button type="submit">Entrar</button>
		</form>
	</section>
	<main>
		<h2>Formulario de registro</h2>
		<article>
			<form>
				<fieldset>
					<legend>Datos de registro</legend>
					<label>* Nombre: </label>
					<input type="text" name="nombre" placeholder="Vuestro nombre" required />
					<label>* Apellido: </label>
					<input type="text" name="apellido" placeholder="Vuestro apellido" required />
					<br />
					<label>* Vuestro DNI</label>
					<input type="text" name="dni3" required pattern="[\dXYZ]\d{7}[ABCDEFGHJKLMNPQRSTVWXYZ]" title="DNI valido"
						placeholder="X0000000X" />
					<br />
					<label>* Usuario: </label>
					<input type="text" name="usuario" placeholder="Usuario" required />
					<label>* Contraseña: </label>
					<input type="password" name="pass" placeholder="Contraseña" required />
					<br />
					<label>* Correo</label>
					<input type="email" name="email" required placeholder="Vuestro email" pattern="\w{1,}@\w{1,}\.\w{2,3}" />
					<br />
					<label>* Sexo:</label>
					<input type="radio" name="sexo" value="h" required><label>Hombre</label>
					<input type="radio" name="sexo" value="m" required><label>Mujer</label>
					<input type="radio" name="sexo" value="n" required><label>No binario</label>
					<br />
				</fieldset>
				<fieldset>
					<legend>Datos opcionales</legend>
					<label>Estilo de música favorito:</label>
					<br />
					<input type="checkbox" name="heavyMetal" value="1"><label>Heavy Metal</label>
					<input type="checkbox" name="rock" value="1"><label>Rock</label>
					<input type="checkbox" name="pop" value="1"><label>Pop</label>
					<input type="checkbox" name="edm" value="1"><label>EDM</label>
					<input type="checkbox" name="jazz" value="1"><label>Jazz</label>
					<br />
					<label>Data de Nacimiento:</label>
					<input type="date" name="nacimiento">
					<br />
				</fieldset>
				<br />
				<input type="checkbox" name="terminos" value="ok" required><label>He leído los términos de uso y la Política de
					privacidad.</label>
				<br />
				<button type="submit">Registrar</button>
				<button type="reset">Borrar</button>
			</form>
			<aside></aside>
		</article>
	</main>
	<footer>
		<figure>
			<img src="img/logomini.png" alt="logo" />
		</figure>
		<ul>
			<li><a href="index.html">Inicio</a></li>
			<li><a href="services.html">Services</a></li>
			<li><a href="galeria.html">Galeria</a></li>
			<li><a href="tienda.html">Tienda</a></li>
			<li><a href="registro.html">Registro</a></li>
			<li><a href="contacto.html">Contacto</a></li>
		</ul>
		<p>Hecho por Svetlana Tereshchenko</p>
	</footer>
</body>

</html>
